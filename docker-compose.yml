services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: groceries_user
      POSTGRES_PASSWORD: groceries_password
      POSTGRES_DB: student_groceries
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groceries_user -d student_groceries"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 student_groceries.wsgi:app
    ports:
      - "8000:8000"
    environment:
      FLASK_APP: student_groceries.wsgi:app
      FLASK_ENV: production
      JWT_SECRET: dev-secret-change-me
      DATABASE_URL: postgresql+psycopg://groceries_user:groceries_password@db:5432/student_groceries
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
